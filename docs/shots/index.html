<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Sentinel — verification screenshots</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0; padding: 32px;
		background: #0b0d10; color: #e8e6df;
		font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
	}
	h1 { font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 4px; }
	p.sub { margin: 0 0 28px; color: #8b9bab; font-size: 13px; }
	figure { margin: 0 0 34px; }
	figure img { width: 100%; max-width: 1100px; display: block; border: 1px solid #1d2a36; border-radius: 6px; }
	figcaption { margin-top: 8px; color: #9fb3c4; font-size: 13px; }
	figcaption b { color: #e8e6df; }
</style>
</head>
<body>
<h1>Reef Sentinel — verification screenshots</h1>
<p class="sub">Produced by <code>tools/verify_ui.gd</code> (windowed render pass, 1152&times;648). Every image is a real frame of the game, not a mock-up.</p>
<p class="sub">Open this file directly in a browser — the game project lives outside this workspace, so nothing here is served.</p>

<figure>
	<img src="01_world_map.png" alt="World map">
	<figcaption><b>01 — World map.</b> Three reef islands cleared and unlocked, two still locked; the sentinel sits on the route.</figcaption>
</figure>

<figure>
	<img src="02_guidebook_invader_entry.png" alt="Guidebook, invasive species entry">
	<figcaption><b>02 — Guidebook.</b> A full-screen, opaque book now: coral-green cover frame, parchment pages with stains and a shaded gutter, white diamond ornament. Left page: species name, threat pips, portrait and field notes. Right page: the stat block, weakness, resistances and spawn zones, all read from the same species table the enemies use. The map behind it is completely covered — the old overlay drew no book at all, so its labels floated over the ocean.</figcaption>
</figure>

<figure>
	<img src="03_guidebook_helper_entry.png" alt="Guidebook, reef helper entry">
	<figcaption><b>03 — Guidebook, reef helper entry.</b> The friendly species get their own entries in the same format: reef role, restore rate per second, and the promise that they are harmless. The tab row under the invaders leads to them.</figcaption>
</figure>

<figure>
	<img src="04_guidebook_last_entry.png" alt="Guidebook, last entry">
	<figcaption><b>04 — Guidebook, last entry.</b> Page navigation, the field-log counter and the reefs-restored tally. Nine entries, all named and detailed whether or not the player has met them.</figcaption>
</figure>

<figure>
	<img src="05_level_harrow_wave.png" alt="Harrow, wave in progress">
	<figcaption><b>05 — Harrow, wave in progress.</b> Volcanic-vent biome, obstacles, hull bar, weapon readout, effectiveness dial.</figcaption>
</figure>

<figure>
	<img src="05b_adaptation_banner.png" alt="Adaptation banner">
	<figcaption><b>05b — Between-wave adaptation banner.</b> Names the traits that moved this generation and what it means for the equipped weapon.</figcaption>
</figure>

<figure>
	<img src="06_level_harrow_low_health.png" alt="Critical hull">
	<figcaption><b>06 — Critical hull.</b> Segmented hull bar in the red, with the screen-edge damage vignette.</figcaption>
</figure>

<figure>
	<img src="07_bubble_dome.png" alt="Bubble dome deployed">
	<figcaption><b>07 — Bubble Dome deployed.</b> The defensive tool in action: it roots what swims into it and absorbs hits.</figcaption>
</figure>

<figure>
	<img src="08_thermal_beam.png" alt="Thermal beam firing">
	<figcaption><b>08 — Thermal Beam.</b> Sustained beam with the heat dial; the beam is the burst weapon with an overheat cost.</figcaption>
</figure>

<figure>
	<img src="09_twelve_enemies.png" alt="A full swarm">
	<figcaption><b>09 — Twelve invasives on screen.</b> Distinct species art, wound tint, spikes grown by the evolved traits.</figcaption>
</figure>

<figure>
	<img src="10_level_redwake.png" alt="Redwake, shallow reef">
	<figcaption><b>10 — Redwake.</b> Shallow reef: open sand, coral bombies, bright water. The first island, two species.</figcaption>
</figure>

<figure>
	<img src="11_level_quiet_belt.png" alt="Quiet Belt, kelp forest">
	<figcaption><b>11 — Quiet Belt.</b> Kelp belt: green palettes, kelp cover, a wreck, four species.</figcaption>
</figure>

<figure>
	<img src="12_level_harrow.png" alt="Harrow, volcanic vents">
	<figcaption><b>12 — Harrow.</b> Volcanic vents: dark rock, ember drift and geysers, the full six-species roster.</figcaption>
</figure>

<figure>
	<img src="13_reef_healthy.png" alt="A dive in progress with the reef meter">
	<figcaption><b>13 — The reef component, mid-dive.</b> Coral beds with a friendly species working them, and the REEF HEALTH meter bottom-left (with the mark showing where this island's reef started).</figcaption>
</figure>

<figure>
	<img src="14_reef_bleached.png" alt="The same coral bed, bleached">
	<figcaption><b>14 — Bleached.</b> The same beds with the reef at zero: bone-white skeleton, polyps gone, an algae mat over everything. Forcing the reef to 0 in the harness is how the comparison below is made honest.</figcaption>
</figure>

<figure>
	<img src="15_reef_restored.png" alt="The same coral bed, restored">
	<figcaption><b>15 — Restored.</b> The same beds at full health: warm, saturated coral with open polyps and a glow. Measured across the three beds, the coral's mean red-green warmth goes from 0.034 bleached to 0.093 restored.</figcaption>
</figure>

<figure>
	<img src="16_plant_prompt.png" alt="A coral bed with the sentinel on it and a plant prompt">
	<figcaption><b>16 — Planting, ready.</b> The lull after a wave: the sentinel parked on a coral bed, a dashed ready ring drawn around the bed, and the <b>HOLD &nbsp;E&nbsp; TO PLANT CORAL</b> prompt with its bar. This state only exists once the wave is over and the water is empty — a momentary gap between two spawns of a live wave leaves the prompt hidden, and holding the key through one plants nothing.</figcaption>
</figure>

<figure>
	<img src="17_planting_coral.png" alt="Mid-hold: an arc filling around the coral bed">
	<figcaption><b>17 — Planting.</b> Mid-hold: the arc sweeps around the bed's rim as the 1.6 s channel runs, and the prompt bar fills with it. The bar and the ring are drawn in code in <code>scenes/levels/reef_site.gd</code>.</figcaption>
</figure>

<figure>
	<img src="18_coral_planted.png" alt="The planted coral head landing, with the HUD confirmation">
	<figcaption><b>18 — Planted.</b> The head landed: a burst on the bed, a real new coral head on the colony, and the confirmation <i>CORAL PLANTED — Head 1 is growing on this bed. +14 reef health.</i> The harness reads the bed's own head count before and after, so the coral growing is measured, not assumed.</figcaption>
</figure>

</body>
</html>
