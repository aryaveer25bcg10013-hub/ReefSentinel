<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Sentinel — verification screenshots</title>
<style>
	:root { color-scheme: dark; }
	body {
		margin: 0; padding: 32px;
		background: #0b0d10; color: #e8e6df;
		font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
	}
	h1 { font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 4px; }
	p.sub { margin: 0 0 28px; color: #8b9bab; font-size: 13px; }
	figure { margin: 0 0 34px; }
	figure img { width: 100%; max-width: 1100px; display: block; border: 1px solid #1d2a36; border-radius: 6px; }
	figcaption { margin-top: 8px; color: #9fb3c4; font-size: 13px; }
	figcaption b { color: #e8e6df; }
</style>
</head>
<body>
<h1>Reef Sentinel — verification screenshots</h1>
<p class="sub">Produced by <code>tools/verify_ui.gd</code> (windowed render pass, 1152&times;648). Every image is a real frame of the game, not a mock-up.</p>

<figure>
	<img src="01_world_map.png" alt="World map">
	<figcaption><b>01 — World map.</b> Three reef islands cleared and unlocked, two still locked; the sentinel sits on the route.</figcaption>
</figure>

<figure>
	<img src="02_bestiary_book.png" alt="Bestiary, first entry">
	<figcaption><b>02 — Bestiary.</b> Code-drawn open book: coral-green cover frame, parchment pages with stains and a shaded gutter, white diamond ornament. First recorded species.</figcaption>
</figure>

<figure>
	<img src="03_bestiary_second_entry.png" alt="Bestiary, second entry">
	<figcaption><b>03 — Bestiary, second entry.</b> Species art, stat block, weakness and spawn zones, all read from the same species table the enemies use.</figcaption>
</figure>

<figure>
	<img src="04_bestiary_third_entry.png" alt="Bestiary, third entry">
	<figcaption><b>04 — Bestiary, third entry.</b> Page navigation and the field-log counter.</figcaption>
</figure>

<figure>
	<img src="05_level_harrow_wave.png" alt="Harrow, wave in progress">
	<figcaption><b>05 — Harrow, wave in progress.</b> Volcanic-vent biome, obstacles, hull bar, weapon readout, effectiveness dial.</figcaption>
</figure>

<figure>
	<img src="05b_adaptation_banner.png" alt="Adaptation banner">
	<figcaption><b>05b — Between-wave adaptation banner.</b> Names the traits that moved this generation and what it means for the equipped weapon.</figcaption>
</figure>

<figure>
	<img src="06_level_harrow_low_health.png" alt="Critical hull">
	<figcaption><b>06 — Critical hull.</b> Segmented hull bar in the red, with the screen-edge damage vignette.</figcaption>
</figure>

<figure>
	<img src="07_bubble_dome.png" alt="Bubble dome deployed">
	<figcaption><b>07 — Bubble Dome deployed.</b> The defensive tool in action: it roots what swims into it and absorbs hits.</figcaption>
</figure>

<figure>
	<img src="08_thermal_beam.png" alt="Thermal beam firing">
	<figcaption><b>08 — Thermal Beam.</b> Sustained beam with the heat dial; the beam is the burst weapon with an overheat cost.</figcaption>
</figure>

<figure>
	<img src="09_twelve_enemies.png" alt="A full swarm">
	<figcaption><b>09 — Twelve invasives on screen.</b> Distinct species art, wound tint, spikes grown by the evolved traits.</figcaption>
</figure>

<figure>
	<img src="10_level_redwake.png" alt="Redwake, shallow reef">
	<figcaption><b>10 — Redwake.</b> Shallow reef: open sand, coral bombies, bright water. The first island, two species.</figcaption>
</figure>

<figure>
	<img src="11_level_quiet_belt.png" alt="Quiet Belt, kelp forest">
	<figcaption><b>11 — Quiet Belt.</b> Kelp belt: green palettes, kelp cover, a wreck, four species.</figcaption>
</figure>

<figure>
	<img src="12_level_harrow.png" alt="Harrow, volcanic vents">
	<figcaption><b>12 — Harrow.</b> Volcanic vents: dark rock, ember drift and geysers, the full six-species roster.</figcaption>
</figure>

</body>
</html>
